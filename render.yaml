services:
  - type: web
    name: it-ticket-resolver
    env: python
    buildCommand: "pip install -r requirements.txt && python data/generate_data.py && python train.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
    plan: free
